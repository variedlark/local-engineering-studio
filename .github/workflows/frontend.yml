name: frontend

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generated bloat guard
        run: pnpm run check:generated
      - name: Architecture boundary guard
        run: pnpm run check:boundaries
      - name: Structural duplicate guard
        run: pnpm run check:duplicates
      - name: File size guard
        run: pnpm run check:file-size
      - name: Critical unwrap guard
        run: pnpm run check:critical
      - name: Typecheck
        run: pnpm --filter desktop-ui check
      - name: Lint
        run: pnpm --filter desktop-ui lint
      - name: Test
        run: pnpm --filter desktop-ui test
      - name: Build
        run: pnpm --filter desktop-ui build
